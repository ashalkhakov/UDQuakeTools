name: Release

# UDQuakeTools for Linux (an AppImage that updates itself), by
# gnustep-release-actions' release workflow, the same as every app's. What is
# UDQuakeTools' own is in .github/release/ (build, install, test, the image's
# configuration); the commits it builds on in .github/pins.env.
#
# A v* tag builds it and attaches it to its release (a pre-release when the
# tag has a '-'). Run by hand with a tag, it builds that tag; with none, this
# branch, as artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dependencies: FreeCoreData
      components: libobjc2 libdispatch tools-make libs-base libs-corebase libs-gui libs-back eau tools-xctest
      extra-packages: libsqlite3-dev libzip-dev xvfb
