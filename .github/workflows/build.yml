name: Build

# UDQuakeTools, built, tested and installed the familiar way (make, make
# check, make install; Makefile.apple on macOS) by gnustep-release-actions'
# workflows, the same as every repository's: every push is built, tested and
# uploaded as artifacts, UDCode's UDQuakeTools extension packaged for each
# platform (.udcx, .github/release/udcode.conf); a v* tag (or a run started by
# hand with one) is also released: the packages and the feeds UDCode updates
# the extension from, attached to the tag's release (a pre-release when the
# tag has a '-'). What it builds on is in .github/pins.env.
on:
  push:
    branches-ignore: ['copilot/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only: a push to a branch already shows its checks on the branch's
# pull request. A newer push supersedes the run before it; a release is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  linux:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/linux.yml@v1
    with:
      tag: ${{ inputs.tag }}
      extra-packages: libsqlite3-dev zlib1g-dev patchelf zip

  windows:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/windows.yml@v1
    with:
      tag: ${{ inputs.tag }}
      extra-packages: sqlite3 zlib
    secrets: inherit

  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos.yml@v1
    with:
      tag: ${{ inputs.tag }}
    # A tag's run signs and notarizes the extension's packages.
    secrets: inherit
