name: Build

# UDQuakeTools for Linux (an AppImage: the launcher and Decl Browser), by
# gnustep-release-actions' workflow, the same as every app's: every push and
# pull request is built, tested (UDCore's tests, the apps started on a clean
# Ubuntu) and uploaded as an artifact; a v* tag (or a run started by hand
# with one) is also released, the AppImage with its update information,
# attached to the tag's release (a pre-release when the tag has a '-').
# What is UDQuakeTools' own is in .github/release/ (build, test, the image's
# configuration); the commits it builds on in .github/pins.env.
on:
  push:
    branches-ignore: ['copilot/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# A push and the pull request for the same branch share one run; a release
# is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      dependencies: FreeCoreData
      extra-packages: libsqlite3-dev libzip-dev
