name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package Linux AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build and install custom GNUstep with modern Clang runtime and ARC
        run: |
          export CC=clang
          export CXX=clang++
          
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          mkdir -p "${LOCAL_PREFIX}"
          
          rm -rf /tmp/gnustep-build
          mkdir -p /tmp/gnustep-build
          cd /tmp/gnustep-build

          echo "=== Building libobjc2 ==="
          git clone --depth 1 --recursive https://github.com/gnustep/libobjc2.git
          cd libobjc2
          cmake -B Build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${LOCAL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build Build -j$(nproc)
          cmake --install Build
          cd ..

          echo "=== Building gnustep-make ==="
          git clone --depth 1 https://github.com/gnustep/tools-make.git
          cd tools-make

          # Force gnustep-make to explicitly bind its library and bundle lookups
          # to match the exact FHS folder paths linuxdeploy uses.
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-layout=fhs \
            --with-library-combo=ng-gnu-gnu \
            --enable-objc-arc \
            --with-system-apps="${LOCAL_PREFIX}/lib/GNUstep/Applications" \
            --with-system-library="${LOCAL_PREFIX}/lib" \
            --with-system-tools="${LOCAL_PREFIX}/bin" \
            CC=clang CXX=clang++
          make -j$(nproc)
          make install
          cd ..

          . "${LOCAL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          export C_INCLUDE_PATH="${LOCAL_PREFIX}/include:${C_INCLUDE_PATH}"
          export CPLUS_INCLUDE_PATH="${LOCAL_PREFIX}/include:${CPLUS_INCLUDE_PATH}"

          echo "=== Building gnustep-base ==="
          git clone --depth 1 https://github.com/gnustep/libs-base.git
          cd libs-base
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-config-file="${LOCAL_PREFIX}/etc/GNUstep.conf" \
            --with-default-config=standalone.conf
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-gui ==="
          git clone --depth 1 https://github.com/gnustep/libs-gui.git
          cd libs-gui
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-back ==="
          git clone --depth 1 https://github.com/gnustep/libs-back.git
          cd libs-back
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building tools-xctest ==="
          git clone --depth 1 https://github.com/gnustep/tools-xctest.git
          cd tools-xctest
          make -j$(nproc)
          make install
          cd ..
          
          echo "=== GNUstep Local Stack Compilation Complete ==="

      - name: Build PakManager App
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Sources/PakManager
          make

      - name: Run Tests
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Tests
          make run-tests

      - name: Prepare AppDir
        run: |
          # Enable print-commands mode so we see exactly what executes in the logs
          set -x
          
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          echo "==== DEBUG: Step 1 - Recreating Directories ===="
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/local/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          echo "==== DEBUG: Step 1 Complete ===="

          echo "==== DEBUG: Step 2 - Executing Make Install ===="
          cd Sources/PakManager
          . "${LOCAL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          make install DESTDIR="${WORKSPACE_DIR}/AppDir" \
                       GNUSTEP_INSTALLATION_DOMAIN=SYSTEM \
                       GNUSTEP_SYSTEM_ROOT="/"
          if [ $? -ne 0 ]; then echo "❌ CRITICAL FAILURE: 'make install' failed!"; exit 1; fi
          cd "${WORKSPACE_DIR}"
          echo "==== DEBUG: Step 2 Complete ===="

          echo "==== DEBUG: Step 3 - Generating GNUstep.conf ===="
          cat << 'EOF' > AppDir/usr/lib/GNUstep.conf
          GNUSTEP_USER_CONFIG_FILE=.GNUstep.conf
          GNUSTEP_USER_DEFAULTS_DIR=GNUstep/Defaults
          GNUSTEP_SYSTEM_USERS_DIR=/home
          GNUSTEP_NETWORK_USERS_DIR=/home
          GNUSTEP_LOCAL_USERS_DIR=/home
          GNUSTEP_SYSTEM_LIBRARY=./
          GNUSTEP_LOCAL_LIBRARY=./
          GNUSTEP_NETWORK_LIBRARY=./
          GNUSTEP_SYSTEM_TOOLS=./
          GNUSTEP_LOCAL_TOOLS=./
          EOF
          chmod 644 AppDir/usr/lib/GNUstep.conf
          echo "==== DEBUG: Step 3 Complete ===="

          echo "==== DEBUG: Step 4 - Copying System Tools ===="
          . "${LOCAL_PREFIX}/share/GNUstep/Makefiles/GNUstep.sh"
          SYSTEM_TOOLS_DIR=$(gnustep-config --variable=GNUSTEP_SYSTEM_TOOLS)
          echo "DEBUG: SYSTEM_TOOLS_DIR discovered as: ${SYSTEM_TOOLS_DIR}"
          
          cp -pv "$SYSTEM_TOOLS_DIR/gdnc" AppDir/usr/lib/ || echo "⚠️ Warning: gdnc fail"
          cp -pv "$SYSTEM_TOOLS_DIR/gpbs" AppDir/usr/lib/ || echo "⚠️ Warning: gpbs fail"
          cp -pv "$SYSTEM_TOOLS_DIR/make_services" AppDir/usr/lib/ || echo "⚠️ Warning: make_services fail"
          cp -pv "$SYSTEM_TOOLS_DIR/gdnc" AppDir/usr/local/bin/ || echo "⚠️ Warning: gdnc local fail"
          cp -pv "$SYSTEM_TOOLS_DIR/gpbs" AppDir/usr/local/bin/ || echo "⚠️ Warning: gpbs local fail"
          cp -pv "$SYSTEM_TOOLS_DIR/make_services" AppDir/usr/local/bin/ || echo "⚠️ Warning: make_services local fail"
          echo "==== DEBUG: Step 4 Complete ===="

          echo "==== DEBUG: Step 5 - Splicing Bundles ===="
          if [ -d "${LOCAL_PREFIX}/lib/GNUstep" ]; then
            cp -Rp "${LOCAL_PREFIX}/lib/GNUstep" AppDir/usr/lib/
          else
            echo "⚠️ Warning: ${LOCAL_PREFIX}/lib/GNUstep missing"
          fi
          
          # No hacky usr/Libraries symlinks needed!
          # We just ensure the generic unversioned fallback bundle link exists inside the correct folder.
          BACKEND_BUNDLE=$(find AppDir/usr/lib/GNUstep -name "libgnustep-back-*.bundle" 2>/dev/null | head -n 1)
          if [ -n "$BACKEND_BUNDLE" ]; then
            BUNDLE_DIR=$(dirname "$BACKEND_BUNDLE")
            ln -sfv $(basename "$BACKEND_BUNDLE") "$BUNDLE_DIR/libgnustep-back.bundle"
          fi
          echo "==== DEBUG: Step 5 Complete ===="
          
          echo "==== DEBUG: Step 6 - Starting Shared Libraries Loop ===="
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:$LD_LIBRARY_PATH"
          for i in {1..3}; do
            echo "DEBUG: Running LDD iteration $i"
            for bin in $(find AppDir -type f \( -executable -o -name "*.so*" -o -name "*.bundle" \) ! -name "*.desktop" 2>/dev/null); do
              # FIX: Appended '|| true' to the grep command so zero-dependency libs don't crash the script
              ldd "$bin" 2>/dev/null | grep "=>" || true | while read -r line; do
                lib=$(echo "$line" | awk '{print $3}')
                if [ -n "$lib" ] && [ -f "$lib" ]; then
                  libname=$(basename "$lib")
                  case "$libname" in
                    libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|libX11.so*|libXext.so*|libxcb.so*|libGL.so*|libGLdispatch.so*|libGLX.so*|libstdc++.so*|libgcc_s.so*)
                      ;;
                    *)
                      if [ ! -f "AppDir/usr/lib/$libname" ]; then
                        echo "Bundling library: $libname from $lib"
                        cp -L "$lib" "AppDir/usr/lib/"
                      fi
                      ;;
                  esac
                fi
              done
            done
          done
          echo "==== DEBUG: Step 6 Complete ===="

          echo "==== DEBUG: Step 7 - Writing Metadata ===="
          cat << 'EOF' > AppDir/PakManager.desktop
          [Desktop Entry]
          Type=Application
          Name=Pak Manager
          Exec=PakManager
          Icon=PakManager
          Categories=Utility;
          Comment=Manage Quake PAK and PK3/PK4 archive files.
          Terminal=false
          EOF

          python3 -c "open('AppDir/PakManager.png', 'wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789cc3070000020001737501170000000049454e44ae426082'))"
          cp -v AppDir/PakManager.png AppDir/usr/share/icons/hicolor/256x256/apps/PakManager.png
          echo "==== DEBUG: Step 7 Complete ===="

          # 8. Create dynamic AppRun script at the root of AppDir
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          # Capture the absolute dynamic mount point of the AppImage namespace
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # Force GNUstep engine variables to map absolutely to the active mount path
          export GNUSTEP_PREFIX="$HERE/usr"
          export GNUSTEP_SYSTEM_ROOT="$HERE/usr"
          export GNUSTEP_LOCAL_ROOT="$HERE/usr"
          export GNUSTEP_NETWORK_ROOT="$HERE/usr"
          
          # Explicitly tell the system tools and library domains where they live
          export GNUSTEP_SYSTEM_TOOLS="$HERE/usr/bin"
          export GNUSTEP_SYSTEM_LIBRARIES="$HERE/usr/lib"
          export GNUSTEP_SYSTEM_HEADERS="$HERE/usr/include"
          
          # Ensure linker and binary execution paths prioritize the AppImage workspace
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export PATH="$HERE/usr/local/bin:$HERE/usr/bin:$PATH"

          # Bypass file-parsing ambiguities by targeting the backend bundle directory explicitly
          export GNUSTEP_TARGET_DIR="$HERE/usr/lib/GNUstep/Bundles"
          
          # Find the real compiled ELF executable inside the AppDir namespace
          REAL_BIN=$(find "$HERE" -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1)

          if [ -z "$REAL_BIN" ]; then
            echo "❌ Error: Could not locate the PakManager ELF binary inside the AppImage!"
            exit 1
          fi

          # Launch the application passing through original command line arguments
          exec "$REAL_BIN" "$@"
          EOF
          chmod -v +x AppDir/AppRun
          
          echo "🎉 End of Script Reached Safely!"

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract

      - name: Package AppImage
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          export PATH="${WORKSPACE_DIR}/squashfs-root/usr/bin:${WORKSPACE_DIR}/squashfs-root/plugins/linuxdeploy-plugin-appimage/usr/bin:$PATH"
          export VERSION="${{ env.APP_VERSION }}"
          export APPIMAGE_EXTRACT_AND_RUN=1

          # FIX 1: Dynamically find the real PakManager application binary anywhere in AppDir
          ELF_ARGS=""
          REAL_APP_BIN=$(find AppDir -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1)
          
          if [ -n "$REAL_APP_BIN" ]; then
            echo "Found application binary for deployment: $REAL_APP_BIN"
            ELF_ARGS="--executable $REAL_APP_BIN"
          else
            echo "❌ CRITICAL ERROR: Could not find PakManager binary in AppDir to pass to linuxdeploy!"
            exit 1
          fi

          # Include the background system tools
          for tool in gdnc gpbs make_services; do
            if [ -f "AppDir/usr/lib/$tool" ]; then
              ELF_ARGS="$ELF_ARGS --executable AppDir/usr/lib/$tool"
            fi
          done

          # FIX 2: Ensure linuxdeploy retains libzip by explicitly prioritizing your AppDir path
          export EXTRA_LD_LIBRARY_PATH="${WORKSPACE_DIR}/AppDir/usr/lib"
          
          LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${WORKSPACE_DIR}/AppDir/usr/lib:$LD_LIBRARY_PATH" \
          squashfs-root/usr/bin/linuxdeploy --appdir AppDir $ELF_ARGS --output appimage
          
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: ./*.AppImage