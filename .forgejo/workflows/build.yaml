name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package UDQuakeTools AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Download and Install GNUstep Toolchain
        run: |
          echo "=== Downloading Pre-compiled Toolchain ==="
          curl -H "Authorization: Bearer ${{ secrets.PACKAGES_TOKEN }}" \
               -o gnustep-toolchain.tar.gz \
               "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/gnustep-toolchain/latest/gnustep-toolchain.tar.gz"

          echo "=== Extracting Toolchain to /opt ==="
          tar -xzvf gnustep-toolchain.tar.gz -C /opt

          ls -la /opt/gnustep-prefix/System/Library/Makefiles/GNUstep.sh

      - name: Build and Install UDCore Library
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"

          cd Sources/UDCore
          make
          make install GNUSTEP_INSTALLATION_DOMAIN=SYSTEM


      - name: Build Apps
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"

          for app in UDLauncher DeclBrowser; do
            cd "Sources/${app}"
            make
            cd "${GITHUB_WORKSPACE}"
          done

      - name: Run Tests
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"

          cd Tests
          make run-tests

      - name: Cache AppImage runtime
        uses: actions/cache@v3
        id: cache-appimage-runtime
        with:
          path: /tmp/appimage-runtime
          key: appimage-runtime-x86_64

      - name: Download AppImage runtime (if not cached)
        if: steps.cache-appimage-runtime.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/appimage-runtime
          curl -L -o /tmp/appimage-runtime/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64

      - name: Prepare AppDir
        run: ./Scripts/prepare-appdir.sh

      - name: Package UDQuakeTools AppImage via linuxdeploy
        run: ./Scripts/package-appimage.sh

      - name: Upload UDQuakeTools AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: UDQuakeTools-Linux-${{ env.APP_VERSION }}
          path: ./UDQuakeTools-Linux-${{ env.APP_VERSION }}.AppImage
