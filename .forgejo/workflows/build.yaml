name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-pakmanager-appimage:
    name: Build and Package PakManager AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Download and Install GNUstep Toolchain
        run: |
          echo "=== Downloading Pre-compiled Toolchain ==="
          curl -H "Authorization: Bearer ${{ secrets.PACKAGES_TOKEN }}" \
               -o gnustep-toolchain.tar.gz \
               "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/gnustep-toolchain/latest/gnustep-toolchain.tar.gz"

          echo "=== Extracting Toolchain to /opt ==="
          # Extract the tarball directly into /opt (restores /opt/gnustep-prefix)
          tar -xzvf gnustep-toolchain.tar.gz -C /opt
          
          # Verify the core Makefile exists where it should
          ls -la /opt/gnustep-prefix/System/Library/Makefiles/GNUstep.sh

      - name: Build PakManager App
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"

          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Sources/PakManager
          make

      - name: Run Tests
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Tests
          make run-tests

      - name: Prepare PakManager AppDir
        run: APP_ID=PakManager APP_SOURCE_DIR=PakManager APP_BUNDLE_NAME=PakManager.app ./Scripts/prepare-appdir.sh

      - name: Package PakManager AppImage via linuxdeploy
        run: APP_ID=PakManager ./Scripts/package-appimage.sh

      - name: Upload PakManager AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: ./PakManager-Linux-${{ env.APP_VERSION }}.AppImage

  build-linux-declbrowser-appimage:
    name: Build and Package DeclBrowser AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Download and Install GNUstep Toolchain
        run: |
          echo "=== Downloading Pre-compiled Toolchain ==="
          curl -H "Authorization: Bearer ${{ secrets.PACKAGES_TOKEN }}" \
               -o gnustep-toolchain.tar.gz \
               "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/gnustep-toolchain/latest/gnustep-toolchain.tar.gz"

          echo "=== Extracting Toolchain to /opt ==="
          tar -xzvf gnustep-toolchain.tar.gz -C /opt

          ls -la /opt/gnustep-prefix/System/Library/Makefiles/GNUstep.sh

      - name: Build DeclBrowser App
        run: |
          export LOCAL_PREFIX="/opt/gnustep-prefix"

          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"

          cd Sources/DeclBrowser
          make

      - name: Prepare DeclBrowser AppDir
        run: APP_ID=DeclBrowser APP_SOURCE_DIR=DeclBrowser APP_BUNDLE_NAME=DeclBrowser.app ./Scripts/prepare-appdir.sh

      - name: Package DeclBrowser AppImage via linuxdeploy
        run: APP_ID=DeclBrowser ./Scripts/package-appimage.sh

      - name: Upload DeclBrowser AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DeclBrowser-Linux-${{ env.APP_VERSION }}
          path: ./DeclBrowser-Linux-${{ env.APP_VERSION }}.AppImage
