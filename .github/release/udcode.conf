# UDCode's UDQuakeTools extension (Sources/Quarry, docs/UDCODE.md): its
# packages, one per platform, and the feed UDCode updates it from, attached
# to each release (gnustep-release-actions' scripts/udcode-extension.sh runs
# this after make install).
PACKAGE=Scripts/udcx.sh
# UDCode with the extension in it, for those who want the tools alone
# (gnustep-release-actions' scripts/udcode-package.sh): UDCode's own package
# for each platform, the extension installed the first time it starts.
UDCODE_PACKAGE=UDCode-UDQuakeTools
