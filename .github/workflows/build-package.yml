name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Install GNUstep and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnustep-devel libgnustep-gui-dev libzip-dev clang libblocksruntime-dev libxml2-dev libxslt1-dev libgnutls28-dev libicu-dev libgcrypt20-dev

      - name: Build and install custom GNUstep in Standalone Deployment Mode
        run: |
          export CC=clang
          export CXX=clang++
          export GCC_INCLUDE_DIR="$(gcc -print-file-name=include)"
          export GCC_LIB_DIR="$(dirname "$(gcc -print-libgcc-file-name)")"
          export CPPFLAGS="-I$GCC_INCLUDE_DIR"
          export LDFLAGS="-L$GCC_LIB_DIR"
          mkdir -p /tmp/gnustep-build
          cd /tmp/gnustep-build

          echo "=== Building gnustep-make ==="
          git clone --depth 1 https://github.com/gnustep/tools-make.git
          cd tools-make
          ./configure --prefix=/usr --with-layout=fhs
          make -j$(nproc)
          sudo make install
          cd ..

          # Load the GNUstep environment
          . /usr/share/GNUstep/Makefiles/GNUstep.sh

          echo "=== Building gnustep-base ==="
          git clone --depth 1 https://github.com/gnustep/libs-base.git
          cd libs-base
          # Patch GNUmakefile to include weak.m when compiling with clang on the GCC runtime.
          # This prevents an undefined reference/hidden symbol error for GSWeakInit during linking.
          sed -i 's/ADDITIONAL_OBJCFLAGS = -fblocks/ADDITIONAL_OBJCFLAGS = -fblocks\n  ObjectiveC2_OBJC_FILES += weak.m/' Source/ObjectiveC2/GNUmakefile
          ./configure --prefix=/usr --with-config-file=./GNUstep.conf --with-default-config=standalone.conf
          make -j$(nproc)
          sudo make install
          cd ..

          echo "=== Building gnustep-gui ==="
          git clone --depth 1 https://github.com/gnustep/libs-gui.git
          cd libs-gui
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          cd ..

          echo "=== Building gnustep-back ==="
          git clone --depth 1 https://github.com/gnustep/libs-back.git
          cd libs-back
          ./configure --prefix=/usr
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build PakManager App
        run: |
          cd Sources/PakManager
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          make

      - name: Prepare AppDir
        run: |
          # 1. Clean and recreate directory structure
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/local/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # 2. Install the app to AppDir
          cd Sources/PakManager
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          make install DESTDIR=$(pwd)/../../AppDir GNUSTEP_INSTALLATION_DOMAIN=SYSTEM
          cd ../..

          # 3. Create relocatable GNUstep.conf inside AppDir/usr/lib/
          cat << 'EOF' > AppDir/usr/lib/GNUstep.conf
          GNUSTEP_USER_CONFIG_FILE=.GNUstep.conf
          GNUSTEP_USER_DEFAULTS_DIR=GNUstep/Defaults
          GNUSTEP_SYSTEM_USERS_DIR=/home
          GNUSTEP_NETWORK_USERS_DIR=/home
          GNUSTEP_LOCAL_USERS_DIR=/home
          GNUSTEP_SYSTEM_LIBRARY=./
          GNUSTEP_LOCAL_LIBRARY=./
          GNUSTEP_NETWORK_LIBRARY=./
          GNUSTEP_SYSTEM_TOOLS=./
          GNUSTEP_LOCAL_TOOLS=./
          EOF
          chmod 644 AppDir/usr/lib/GNUstep.conf

          # 4. Copy GNUstep system tools to AppDir/usr/lib/ (where GNUstep-base looks for them in standalone mode)
          # and also AppDir/usr/local/bin for standard execution
          . /usr/share/GNUstep/Makefiles/GNUstep.sh
          SYSTEM_TOOLS_DIR=$(gnustep-config --variable=GNUSTEP_SYSTEM_TOOLS)
          cp -p $SYSTEM_TOOLS_DIR/gdnc AppDir/usr/lib/
          cp -p $SYSTEM_TOOLS_DIR/gpbs AppDir/usr/lib/
          cp -p $SYSTEM_TOOLS_DIR/make_services AppDir/usr/lib/
          cp -p $SYSTEM_TOOLS_DIR/gdnc AppDir/usr/local/bin/
          cp -p $SYSTEM_TOOLS_DIR/gpbs AppDir/usr/local/bin/
          cp -p $SYSTEM_TOOLS_DIR/make_services AppDir/usr/local/bin/

          # 5. Copy GNUstep Bundles and resources
          cp -Rp /usr/lib/GNUstep AppDir/usr/lib/
          BACKEND_BUNDLE=$(find AppDir/usr/lib/GNUstep/Bundles -name "libgnustep-back-*.bundle" | head -n 1)
          if [ -n "$BACKEND_BUNDLE" ]; then
            ln -sf $(basename "$BACKEND_BUNDLE") AppDir/usr/lib/GNUstep/Bundles/libgnustep-back.bundle
          fi

          # 6. Build/Bundle Shared Libraries via iterative ldd scan.
          # We run 3 iterations to recursively resolve transitive dependencies of bundled libraries.
          for i in {1..3}; do
            for bin in $(find AppDir -type f \( -executable -o -name "*.so*" -o -name "*.bundle" \)); do
              ldd "$bin" 2>/dev/null | grep "=>" | while read -r line; do
                lib=$(echo "$line" | awk '{print $3}')
                if [ -n "$lib" ] && [ -f "$lib" ]; then
                  libname=$(basename "$lib")
                  case "$libname" in
                    libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|libX11.so*|libXext.so*|libxcb.so*|libGL.so*|libGLdispatch.so*|libGLX.so*|libstdc++.so*|libgcc_s.so*)
                      ;;
                    *)
                      if [ ! -f "AppDir/usr/lib/$libname" ]; then
                        echo "Bundling library: $libname from $lib"
                        cp -L "$lib" "AppDir/usr/lib/"
                      fi
                      ;;
                  esac
                fi
              done
            done
          done

          # 7. Create desktop file and placeholder PNG icon
          cat << 'EOF' > AppDir/PakManager.desktop
          [Desktop Entry]
          Type=Application
          Name=Pak Manager
          Exec=PakManager
          Icon=PakManager
          Categories=Utility;
          Comment=Manage Quake PAK and PK3/PK4 archive files.
          Terminal=false
          EOF

          python3 -c "open('AppDir/PakManager.png', 'wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789cc3070000020001737501170000000049454e44ae426082'))"
          cp AppDir/PakManager.png AppDir/usr/share/icons/hicolor/256x256/apps/PakManager.png

          # 8. Create dynamic AppRun script at the root of AppDir
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export GNUSTEP_PREFIX="$HERE/usr"
          export GNUSTEP_SYSTEM_ROOT="$HERE/usr"
          export GNUSTEP_LOCAL_ROOT="$HERE/usr"
          export GNUSTEP_NETWORK_ROOT="$HERE/usr"
          export GNUSTEP_CONFIG_FILE="$HERE/usr/lib/GNUstep.conf"
          export GNUSTEP_SYSTEM_LIBRARIES="$HERE/usr/lib"
          export GNUSTEP_LOCAL_LIBRARIES="$HERE/usr/lib"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export PATH="$HERE/usr/local/bin:$HERE/usr/bin:$PATH"

          # Find the actual ELF binary named PakManager inside PakManager.app
          REAL_BIN=$(find "$HERE/usr/lib/GNUstep/Applications/PakManager.app" -type f -name "PakManager" -exec file {} \; | grep "ELF" | cut -d: -f1 | head -n 1)

          if [ -z "$REAL_BIN" ]; then
            # Fallback to the wrapper or whatever file is at the root of PakManager.app
            REAL_BIN="$HERE/usr/lib/GNUstep/Applications/PakManager.app/PakManager"
          fi

          exec "$REAL_BIN" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract

      - name: Package AppImage
        run: |
          export PATH="$(pwd)/squashfs-root/usr/bin:$(pwd)/squashfs-root/plugins/linuxdeploy-plugin-appimage/usr/bin:$PATH"
          export VERSION="${{ env.APP_VERSION }}"

          # Find all actual ELF binaries to let linuxdeploy process them
          ELF_ARGS=""
          for f in $(find AppDir/usr/lib/GNUstep/Applications/PakManager.app -type f 2>/dev/null); do
            if file "$f" | grep -q "ELF"; then
              ELF_ARGS="$ELF_ARGS --executable $f"
            fi
          done
          for tool in gdnc gpbs make_services; do
            if [ -f "AppDir/usr/lib/$tool" ]; then
              ELF_ARGS="$ELF_ARGS --executable AppDir/usr/lib/$tool"
            fi
          done

          squashfs-root/usr/bin/linuxdeploy --appdir AppDir $ELF_ARGS --output appimage

          # Clean up downloaded AppImages to ensure only PakManager is pushed
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: "*.AppImage"

  build-macos-app:
    name: Build and Package Mac App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          brew install libzip

      - name: Build macOS App with Xcode
        run: |
          xcodebuild -project PakManager.xcodeproj \
            -target "Pak Manager" \
            -configuration Release \
            SYMROOT=Build \
            CODE_SIGN_IDENTITY="-" \
            ARCHS="arm64" \
            MARKETING_VERSION="${{ env.APP_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package macOS App
        run: |
          cd Build/Release
          zip -r ../../PakManager-macOS-${{ env.APP_VERSION }}.zip PakManager.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakManager-macOS-${{ env.APP_VERSION }}
          path: PakManager-macOS-${{ env.APP_VERSION }}.zip
