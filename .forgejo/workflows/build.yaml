name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package Linux AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build and install custom GNUstep with modern Clang runtime and ARC
        run: |
          export CC=clang
          export CXX=clang++
          
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          mkdir -p "${LOCAL_PREFIX}"
          
          rm -rf /tmp/gnustep-build
          mkdir -p /tmp/gnustep-build
          cd /tmp/gnustep-build

          echo "=== Building libobjc2 ==="
          git clone --depth 1 --recursive https://github.com/gnustep/libobjc2.git
          cd libobjc2
          cmake -B Build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${LOCAL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build Build -j$(nproc)
          cmake --install Build
          cd ..

          echo "=== Building gnustep-make ==="
          git clone --depth 1 https://github.com/gnustep/tools-make.git
          cd tools-make
          
          # Force the cohesive native layout
          # Explicitly feed the compiler the local search paths so it detects libobjc2
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-layout=gnustep \
            --with-library-combo=ng-gnu-gnu \
            --enable-objc-arc \
            CPPFLAGS="-I${LOCAL_PREFIX}/include" \
            LDFLAGS="-L${LOCAL_PREFIX}/lib -Wl,-rpath,${LOCAL_PREFIX}/lib" \
            CC=clang CXX=clang++
          make -j$(nproc)
          make install
          cd ..

          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          export C_INCLUDE_PATH="${LOCAL_PREFIX}/include:${C_INCLUDE_PATH}"
          export CPLUS_INCLUDE_PATH="${LOCAL_PREFIX}/include:${CPLUS_INCLUDE_PATH}"

          echo "=== Building gnustep-base ==="
          git clone --depth 1 https://github.com/gnustep/libs-base.git
          cd libs-base
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-config-file="${LOCAL_PREFIX}/etc/GNUstep.conf" \
            --with-default-config=standalone.conf
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-gui ==="
          git clone --depth 1 https://github.com/gnustep/libs-gui.git
          cd libs-gui
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-back ==="
          git clone --depth 1 https://github.com/gnustep/libs-back.git
          cd libs-back
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building tools-xctest ==="
          git clone --depth 1 https://github.com/gnustep/tools-xctest.git
          cd tools-xctest
          make -j$(nproc)
          make install
          cd ..
          
          echo "=== GNUstep Local Stack Compilation Complete ==="

      - name: Build PakManager App
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Sources/PakManager
          make

      - name: Run Tests
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Tests
          make run-tests

      - name: Prepare AppDir
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          # 1. Recreate clean AppDir structural root
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/etc
          mkdir -p AppDir/usr/local/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # 2. Install PakManager safely letting gnustep-make handle its defaults
          cd Sources/PakManager
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          make install DESTDIR="${WORKSPACE_DIR}/AppDir"
          cd "${WORKSPACE_DIR}"

          # 3. Create a relocatable native GNUstep.conf that maps BOTH domains
          cat << 'EOF' > AppDir/usr/etc/GNUstep.conf
          GNUSTEP_USER_CONFIG_FILE=.GNUstep.conf
          GNUSTEP_USER_DEFAULTS_DIR=GNUstep/Defaults
          GNUSTEP_SYSTEM_USERS_DIR=/home
          GNUSTEP_NETWORK_USERS_DIR=/home
          GNUSTEP_LOCAL_USERS_DIR=/home
          GNUSTEP_SYSTEM_ROOT=./System
          GNUSTEP_SYSTEM_LIBRARY=./System/Library
          GNUSTEP_SYSTEM_TOOLS=./System/Tools
          GNUSTEP_SYSTEM_APPS=./System/Applications
          GNUSTEP_LOCAL_ROOT=./Local
          GNUSTEP_LOCAL_LIBRARY=./Local/Library
          GNUSTEP_LOCAL_TOOLS=./Local/Tools
          GNUSTEP_LOCAL_APPS=./Local/Applications
          EOF
          chmod 644 AppDir/usr/etc/GNUstep.conf

          # 4. Dynamically locate the background tools wherever they sit inside the prefix
          for tool in gdnc gpbs make_services; do
            FOUND_TOOL=$(find "${LOCAL_PREFIX}" -type f -name "$tool" 2>/dev/null | head -n 1)
            if [ -n "$FOUND_TOOL" ]; then
              echo "Found system tool $tool at: $FOUND_TOOL"
              cp -p "$FOUND_TOOL" AppDir/usr/lib/
              cp -p "$FOUND_TOOL" AppDir/usr/local/bin/
            fi
          done

          # 5. FIX: Pull BOTH System and Local hierarchies into AppDir/usr/
          if [ -d "${LOCAL_PREFIX}/System" ]; then
            mkdir -p AppDir/usr/System
            cp -Rp "${LOCAL_PREFIX}/System/"* AppDir/usr/System/
          fi
          if [ -d "${LOCAL_PREFIX}/Local" ]; then
            mkdir -p AppDir/usr/Local
            cp -Rp "${LOCAL_PREFIX}/Local/"* AppDir/usr/Local/
          fi
          
          # Migrate the nested app bundle into its correct target layout domain
          DEEP_APP_DIR=$(find AppDir -type d -name "PakManager.app" 2>/dev/null | grep -v "usr/" | head -n 1)
          if [ -n "$DEEP_APP_DIR" ]; then
            echo "Relocating nested app bundle from $DEEP_APP_DIR"
            mkdir -p AppDir/usr/Local/Applications
            cp -Rp "$DEEP_APP_DIR" AppDir/usr/Local/Applications/
          fi

          # Clean up residual build artifact folders at the top level of AppDir
          find AppDir -maxdepth 1 -type d ! -name "AppDir" ! -name "usr" -exec rm -rf {} + 2>/dev/null || true

          # Maintain versioned fallback bundle linking inside whichever tree has the backend
          BACKEND_BUNDLE=$(find AppDir/usr -name "libgnustep-back-*.bundle" 2>/dev/null | head -n 1)
          if [ -n "$BACKEND_BUNDLE" ]; then
            BUNDLE_DIR=$(dirname "$BACKEND_BUNDLE")
            ln -sfv $(basename "$BACKEND_BUNDLE") "$BUNDLE_DIR/libgnustep-back.bundle"
          fi

          # 6. Shared Libraries loop script
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/System/Library/Libraries:${LOCAL_PREFIX}/Local/Library/Libraries:$LD_LIBRARY_PATH"
          for i in {1..3}; do
            for bin in $(find AppDir -type f \( -executable -o -name "*.so*" -o -name "*.bundle" \) ! -name "*.desktop" 2>/dev/null); do
              ldd "$bin" 2>/dev/null | grep "=>" || true | while read -r line; do
                lib=$(echo "$line" | awk '{print $3}')
                if [ -n "$lib" ] && [ -f "$lib" ]; then
                  libname=$(basename "$lib")
                  case "$libname" in
                    libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|libX11.so*|libXext.so*|libxcb.so*|libGL.so*|libGLdispatch.so*|libGLX.so*|libstdc++.so*|libgcc_s.so*)
                      ;;
                    *)
                      if [ ! -f "AppDir/usr/lib/$libname" ]; then
                        echo "Bundling library: $libname from $lib"
                        cp -L "$lib" "AppDir/usr/lib/"
                      fi
                      ;;
                  esac
                fi
              done
            done
          done

          # 7. Metadata Generation
          cat << 'EOF' > AppDir/PakManager.desktop
          [Desktop Entry]
          Type=Application
          Name=Pak Manager
          Exec=PakManager
          Icon=PakManager
          Categories=Utility;
          Comment=Manage Quake PAK and PK3/PK4 archive files.
          Terminal=false
          EOF

          python3 -c "open('AppDir/PakManager.png', 'wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789cc3070000020001737501170000000049454e44ae426082'))"
          cp AppDir/PakManager.png AppDir/usr/share/icons/hicolor/256x256/apps/PakManager.png

          # 8. Optimized AppRun Script mapping both structural branches
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          export GNUSTEP_PREFIX="$HERE/usr"
          export GNUSTEP_CONFIG_FILE="$HERE/usr/etc/GNUstep.conf"
          
          # Declare System mappings
          export GNUSTEP_SYSTEM_ROOT="$HERE/usr/System"
          export GNUSTEP_SYSTEM_LIBRARY="$HERE/usr/System/Library"
          export GNUSTEP_SYSTEM_TOOLS="$HERE/usr/System/Tools"
          export GNUSTEP_SYSTEM_APPS="$HERE/usr/System/Applications"
          
          # Declare Local mappings
          export GNUSTEP_LOCAL_ROOT="$HERE/usr/Local"
          export GNUSTEP_LOCAL_LIBRARY="$HERE/usr/Local/Library"
          export GNUSTEP_LOCAL_TOOLS="$HERE/usr/Local/Tools"
          export GNUSTEP_LOCAL_APPS="$HERE/usr/Local/Applications"
          
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/System/Library/Libraries:$HERE/usr/Local/Library/Libraries:$LD_LIBRARY_PATH"
          export PATH="$HERE/usr/local/bin:$HERE/usr/bin:$PATH"

          REAL_BIN=$(find "$HERE" -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1)
          if [ -z "$REAL_BIN" ]; then
            REAL_BIN="$HERE/usr/Local/Applications/PakManager.app/PakManager"
          fi
          exec "$REAL_BIN" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract

      - name: Package AppImage
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          export PATH="${WORKSPACE_DIR}/squashfs-root/usr/bin:${WORKSPACE_DIR}/squashfs-root/plugins/linuxdeploy-plugin-appimage/usr/bin:$PATH"
          export VERSION="${{ env.APP_VERSION }}"
          export APPIMAGE_EXTRACT_AND_RUN=1

          ELF_ARGS=""
          
          # 1. Find the core application binary
          REAL_APP_BIN=$(find AppDir -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1)
          if [ -n "$REAL_APP_BIN" ]; then
            echo "Found application binary for deployment: $REAL_APP_BIN"
            ELF_ARGS="--executable $REAL_APP_BIN"
          else
            echo "❌ CRITICAL ERROR: Could not find PakManager binary!"
            exit 1
          fi

          # 2. Include background services
          for tool in gdnc gpbs make_services; do
            if [ -f "AppDir/usr/lib/$tool" ]; then
              ELF_ARGS="$ELF_ARGS --executable AppDir/usr/lib/$tool"
            fi
          done

          # 3. FIX: Force linuxdeploy to inspect and trace the hidden GNUstep backend bundle binary!
          BACKEND_SO=$(find AppDir/usr -path "*/Bundles/*" -type f -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1)
          if [ -n "$BACKEND_SO" ]; then
            echo "Found hidden backend bundle binary to trace: $BACKEND_SO"
            ELF_ARGS="$ELF_ARGS --executable $BACKEND_SO"
          else
            echo "⚠️ Warning: Could not locate internal bundle binary for dependency injection!"
          fi

          # Retain manually collected custom libs during cleanups
          export EXTRA_LD_LIBRARY_PATH="${WORKSPACE_DIR}/AppDir/usr/lib"
          
          # Inject exact native paths for resolution
          LD_LIBRARY_PATH="${LOCAL_PREFIX}/System/Library/Libraries:${LOCAL_PREFIX}/Local/Library/Libraries:${WORKSPACE_DIR}/AppDir/usr/lib:$LD_LIBRARY_PATH" \
          squashfs-root/usr/bin/linuxdeploy --appdir AppDir $ELF_ARGS --output appimage
          
          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: ./*.AppImage