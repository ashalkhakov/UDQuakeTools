name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package Linux AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build and install custom GNUstep with modern Clang runtime and ARC
        run: ./Scripts/build-gnustep.sh

      - name: Build PakManager App
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Sources/PakManager
          make

      - name: Run Tests
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Tests
          make run-tests

      - name: Prepare AppDir
        run: ./Scripts/prepare-appdir.sh

      - name: Package AppImage via linuxdeploy
        run: ./Scripts/package-appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: ./*.AppImage
