# UDQuakeTools' Windows installer: what it carries and starts. The installer
# is gnustep-release-actions' msi (the runtime, WinUXTheme), the same as
# every app's; see its msi.sh for each name.
NAME=UDQuakeTools
# The launcher, and the tools it starts.
APPS="UDLauncher Quarry PakManager"
DEFAULT=UDLauncher
# Pak Manager's icon, at the 256x256 an installer takes
ICON=Scripts/windows/UDQuakeTools.png
SUMMARY="Tools for Doom 3's files: a launcher, Quarry (decls, scripts, GUIs) and Pak Manager"
# No self-test: started bare the launcher is still up 25 seconds later, its
# interface loaded, as the AppImage's smoke test has it.
SMOKE_STAYS_UP=25
