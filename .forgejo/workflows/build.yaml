name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    name: Build and Package Linux AppImage
    runs-on: [linux-amd64, clang]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Version Environment Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0-build${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build and install custom GNUstep with modern Clang runtime and ARC
        run: |
          export CC=clang
          export CXX=clang++
          
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          mkdir -p "${LOCAL_PREFIX}"
          
          rm -rf /tmp/gnustep-build
          mkdir -p /tmp/gnustep-build
          cd /tmp/gnustep-build

          echo "=== Building libobjc2 ==="
          git clone --depth 1 --recursive https://github.com/gnustep/libobjc2.git
          cd libobjc2
          cmake -B Build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${LOCAL_PREFIX}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build Build -j$(nproc)
          cmake --install Build
          cd ..

          echo "=== Building gnustep-make ==="
          git clone --depth 1 https://github.com/gnustep/tools-make.git
          cd tools-make
          
          # Force the cohesive native layout
          # Explicitly feed the compiler the local search paths so it detects libobjc2
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-layout=gnustep \
            --with-library-combo=ng-gnu-gnu \
            --enable-objc-arc \
            CPPFLAGS="-I${LOCAL_PREFIX}/include" \
            LDFLAGS="-L${LOCAL_PREFIX}/lib -Wl,-rpath,${LOCAL_PREFIX}/lib" \
            CC=clang CXX=clang++
          make -j$(nproc)
          make install
          cd ..

          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          export C_INCLUDE_PATH="${LOCAL_PREFIX}/include:${C_INCLUDE_PATH}"
          export CPLUS_INCLUDE_PATH="${LOCAL_PREFIX}/include:${CPLUS_INCLUDE_PATH}"

          echo "=== Building gnustep-base ==="
          git clone --depth 1 https://github.com/gnustep/libs-base.git
          cd libs-base
          ./configure --prefix="${LOCAL_PREFIX}" \
            --with-config-file="${LOCAL_PREFIX}/etc/GNUstep.conf" \
            --with-default-config=standalone.conf
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-gui ==="
          git clone --depth 1 https://github.com/gnustep/libs-gui.git
          cd libs-gui
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building gnustep-back ==="
          git clone --depth 1 https://github.com/gnustep/libs-back.git
          cd libs-back
          ./configure --prefix="${LOCAL_PREFIX}"
          make -j$(nproc)
          make install
          cd ..

          echo "=== Building tools-xctest ==="
          git clone --depth 1 https://github.com/gnustep/tools-xctest.git
          cd tools-xctest
          make -j$(nproc)
          make install
          cd ..
          
          echo "=== Building libdispatch (runtime dependency for Eau) ==="
          git clone --depth 1 https://github.com/apple/swift-corelibs-libdispatch.git libdispatch
          cd libdispatch
          cmake -B Build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${LOCAL_PREFIX}"
          cmake --build Build -j$(nproc)
          cmake --install Build
          cd ..

          echo "=== Building Eau Theme ==="
          # Clone the theme from Gershwin / GNUstep ports
          git clone --depth 1 https://github.com/gershwin-desktop/gershwin-eau-theme.git Eau
          cd Eau
          # source the environment to let gnustep-make install it inside the local prefix
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          make -j$(nproc)
          make install
          cd ..

          echo "=== GNUstep Local Stack Compilation Complete ==="

      - name: Build PakManager App
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Sources/PakManager
          make

      - name: Run Tests
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="${LOCAL_PREFIX}/lib:${LD_LIBRARY_PATH}"
          
          cd Tests
          make run-tests

      - name: Prepare AppDir
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          # 1. Recreate clean AppDir structural root
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/etc
          mkdir -p AppDir/usr/local/bin

          # 2. Install PakManager safely letting gnustep-make handle its defaults
          cd Sources/PakManager
          . "${LOCAL_PREFIX}/System/Library/Makefiles/GNUstep.sh"
          make install DESTDIR="${WORKSPACE_DIR}/AppDir"
          cd "${WORKSPACE_DIR}"

          if [ -d "${LOCAL_PREFIX}/System/Library/Themes" ]; then
            mkdir -p AppDir/usr/System/Library/Themes
            cp -Rp "${LOCAL_PREFIX}/System/Library/Themes/"* AppDir/usr/System/Library/Themes/
          fi

          # 3. Dynamically locate the background tools
          for tool in gdnc gpbs make_services; do
            FOUND_TOOL=$(find "${LOCAL_PREFIX}" -type f -name "$tool" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_TOOL" ]; then
              cp -p "$FOUND_TOOL" AppDir/usr/lib/
              cp -p "$FOUND_TOOL" AppDir/usr/local/bin/
            fi
          done

          # 4. Pull BOTH System and Local hierarchies into AppDir/usr/
          if [ -d "${LOCAL_PREFIX}/System" ]; then
            mkdir -p AppDir/usr/System
            cp -Rp "${LOCAL_PREFIX}/System/"* AppDir/usr/System/
          fi
          if [ -d "${LOCAL_PREFIX}/Local" ]; then
            mkdir -p AppDir/usr/Local
            cp -Rp "${LOCAL_PREFIX}/Local/"* AppDir/usr/Local/
          fi
          
          # Bundle libobjc from the prefix base lib directory
          if [ -f "${LOCAL_PREFIX}/lib/libobjc.so.4.6" ]; then
            cp -p "${LOCAL_PREFIX}/lib/libobjc.so.4.6" AppDir/usr/lib/
            ln -sf libobjc.so.4.6 AppDir/usr/lib/libobjc.so.4
            ln -sf libobjc.so.4.6 AppDir/usr/lib/libobjc.so
          fi

          # 5. Maintain versioned and unversioned fallback bundle linking
          BACKEND_BUNDLE=$(find AppDir/usr -name "libgnustep-back-*.bundle" 2>/dev/null | head -n 1 || true)
          if [ -n "$BACKEND_BUNDLE" ]; then
            BUNDLE_DIR=$(dirname "$BACKEND_BUNDLE")
            BUNDLE_NAME=$(basename "$BACKEND_BUNDLE")
            ln -sfv "$BUNDLE_NAME" "$BUNDLE_DIR/libgnustep-back.bundle" || true
            ln -sfv "$BUNDLE_NAME" "$BUNDLE_DIR/back.bundle" || true
          fi
          
          # Migrate the nested app bundle safely (immune to grep-v empty return traps)
          DEEP_APP_DIR=$(find AppDir -type d -name "PakManager.app" 2>/dev/null | grep -v "usr/" | head -n 1 || true)
          if [ -n "$DEEP_APP_DIR" ]; then
            mkdir -p AppDir/usr/Local/Applications
            cp -Rp "$DEEP_APP_DIR" AppDir/usr/Local/Applications/
          fi

          # Clean up residual folders
          find AppDir -maxdepth 1 -type d ! -name "AppDir" ! -name "usr" -exec rm -rf {} + 2>/dev/null || true

          # Repeat bundle link fix in case migration shifted the target
          BACKEND_BUNDLE_TWO=$(find AppDir/usr -name "libgnustep-back-*.bundle" 2>/dev/null | head -n 1 || true)
          if [ -n "$BACKEND_BUNDLE_TWO" ]; then
            BUNDLE_DIR=$(dirname "$BACKEND_BUNDLE_TWO")
            ln -sfv $(basename "$BACKEND_BUNDLE_TWO") "$BUNDLE_DIR/libgnustep-back.bundle" || true
          fi

          # Bring in localized string formats safely
          #if [ -d "/usr/lib/x86_64-linux-gnu/gconv" ]; then
          #  mkdir -p AppDir/usr/lib/gconv
          #  cp -Rp /usr/lib/x86_64-linux-gnu/gconv/* AppDir/usr/lib/gconv/
          #elif [ -d "/usr/lib64/gconv" ]; then
          #  mkdir -p AppDir/usr/lib/gconv
          #  cp -Rp /usr/lib64/gconv/* AppDir/usr/lib/gconv/
          #fi

          # 6. Shared Libraries collection (Pipefail-Immune!)
          #export LD_LIBRARY_PATH="${LOCAL_PREFIX}/System/Library/Libraries:${LOCAL_PREFIX}/Local/Library/Libraries:$LD_LIBRARY_PATH"

          # 7. Bulletproof AppRun Launcher (Dynamic Conf Generation)
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # Force a fully-resolved path GNUstep.conf to bypass CWD resolution crashes
          mkdir -p "$HERE/usr/etc"
          cat << IN_EOF > "$HERE/usr/etc/GNUstep.conf"
          GNUSTEP_USER_CONFIG_FILE=.GNUstep.conf
          GNUSTEP_USER_DEFAULTS_DIR=GNUstep/Defaults
          GNUSTEP_SYSTEM_USERS_DIR=/home
          GNUSTEP_NETWORK_USERS_DIR=/home
          GNUSTEP_LOCAL_USERS_DIR=/home
          GNUSTEP_SYSTEM_ROOT=$HERE/usr/System
          GNUSTEP_SYSTEM_LIBRARY=$HERE/usr/System/Library
          GNUSTEP_SYSTEM_TOOLS=$HERE/usr/System/Tools
          GNUSTEP_SYSTEM_APPS=$HERE/usr/System/Applications
          GNUSTEP_LOCAL_ROOT=$HERE/usr/Local
          GNUSTEP_LOCAL_LIBRARY=$HERE/usr/Local/Library
          GNUSTEP_LOCAL_TOOLS=$HERE/usr/Local/Tools
          GNUSTEP_LOCAL_APPS=$HERE/usr/Local/Applications
          IN_EOF

          export GNUSTEP_PREFIX="$HERE/usr"
          export GNUSTEP_CONFIG_FILE="$HERE/usr/etc/GNUstep.conf"

          # Pointing to the host's real home directory
          export GNUSTEP_USER_ROOT="$HOME"
          export GNUSTEP_USER_DEFAULTS_DIR="$HOME/GNUstep/Defaults"

          export GNUSTEP_SYSTEM_ROOT="$HERE/usr/System"
          export GNUSTEP_SYSTEM_LIBRARY="$HERE/usr/System/Library"
          export GNUSTEP_SYSTEM_TOOLS="$HERE/usr/System/Tools"
          export GNUSTEP_SYSTEM_APPS="$HERE/usr/System/Applications"
          
          export GNUSTEP_LOCAL_ROOT="$HERE/usr/Local"
          export GNUSTEP_LOCAL_LIBRARY="$HERE/usr/Local/Library"
          export GNUSTEP_LOCAL_TOOLS="$HERE/usr/Local/Tools"
          export GNUSTEP_LOCAL_APPS="$HERE/usr/Local/Applications"

          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/System/Library/Libraries:$HERE/usr/Local/Library/Libraries:$LD_LIBRARY_PATH"
          export PATH="$HERE/usr/local/bin:$HERE/usr/bin:$PATH"

          . "$HERE/usr/System/Library/Makefiles/GNUstep.sh"

          # Kill off localized encoding mismatches
          #unset GCONV_PATH
          #export LC_ALL=C
          #export LANG=C
          
          # Find and boot the target
          REAL_BIN=$(find "$HERE" -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1 || true)
          if [ -z "$REAL_BIN" ]; then
            REAL_BIN="$HERE/usr/Local/Applications/PakManager.app/PakManager"
          fi

          # SET DEFAULTS NATIVELY BEFORE LAUNCH
          # Point the GNUSTEP_USER_ROOT to a writable folder inside /tmp/
          # so 'defaults' has a place to write the .GNUstepDefaults file.
          #export GNUSTEP_USER_ROOT="/tmp/gnustep-home"
          #mkdir -p "$GNUSTEP_USER_ROOT/GNUstep/Defaults"
          # We use the isolated 'PakManager' domain to avoid messing up the host's global defaults
          if [ -x "$HERE/usr/System/Tools/defaults" ]; then
            echo "Running defaults command..."
            "$HERE/usr/System/Tools/defaults" write PakManager GSTheme "Eau" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSFont "Sans" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSUserFont "Sans" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSUserFixedPitchFont "Monospace" || true
          else
            echo "ERROR: defaults tool not found at $HERE/usr/System/Tools/defaults"
          fi
          
          # Force Eau theme activation and pass universally mapped fallback fonts
          exec "$REAL_BIN" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Verify AppDir Layout
        run: |
          echo "=== Verifying Built Artifact Directory Structure ==="
          if [ ! -f "AppDir/AppRun" ]; then
            echo "❌ Error: AppRun script is missing from AppDir!"
            exit 1
          fi
          
          chmod +x AppDir/AppRun
          echo "✅ AppDir is ready and configured natively!"
          ls -la AppDir/

      - name: Package AppImage via linuxdeploy
        run: |
          WORKSPACE_DIR=$(pwd)
          LOCAL_PREFIX="${WORKSPACE_DIR}/gnustep-prefix"
          
          # 1. Restore Metadata (Strictly required by linuxdeploy)
          cat << 'EOF' > AppDir/PakManager.desktop
          [Desktop Entry]
          Type=Application
          Name=Pak Manager
          Exec=AppRun
          Icon=PakManager
          Categories=Utility;
          Terminal=false
          EOF
          
          python3 -c "open('AppDir/PakManager.png', 'wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789cc3070000020001737501170000000049454e44ae426082'))" || true

          # 2. Inject your Secret Sauce AppRun Script (Read-Only & Path Leak Safe)
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # 1. Write the config to the host's writable /tmp directory
          export GNUSTEP_CONFIG_FILE="/tmp/GNUstep-PakManager-$$.conf"
          
          cat << IN_EOF > "$GNUSTEP_CONFIG_FILE"
          GNUSTEP_USER_CONFIG_FILE=.GNUstep.conf
          GNUSTEP_USER_DEFAULTS_DIR=GNUstep/Defaults
          GNUSTEP_SYSTEM_USERS_DIR=/home
          GNUSTEP_NETWORK_USERS_DIR=/home
          GNUSTEP_LOCAL_USERS_DIR=/home
          GNUSTEP_SYSTEM_ROOT=$HERE/usr/System
          # Ensure themes are searchable
          GNUSTEP_SYSTEM_LIBRARIES=$HERE/usr/System/Library
          GNUSTEP_SYSTEM_LIBRARY=$HERE/usr/System/Library
          GNUSTEP_SYSTEM_TOOLS=$HERE/usr/System/Tools
          GNUSTEP_SYSTEM_APPS=$HERE/usr/System/Applications
          GNUSTEP_LOCAL_ROOT=$HERE/usr/Local
          GNUSTEP_LOCAL_LIBRARY=$HERE/usr/Local/Library
          GNUSTEP_LOCAL_TOOLS=$HERE/usr/Local/Tools
          GNUSTEP_LOCAL_APPS=$HERE/usr/Local/Applications
          IN_EOF

          # FIX: Lock down the config file so GNUstep's security checks accept it
          chmod 600 "$GNUSTEP_CONFIG_FILE"

          # 2. Manually inject the boundary variables (Bypassing the poisoned GNUstep.sh)
          export GNUSTEP_SYSTEM_ROOT="$HERE/usr/System"
          export GNUSTEP_SYSTEM_LIBRARY="$HERE/usr/System/Library"
          export GNUSTEP_SYSTEM_TOOLS="$HERE/usr/System/Tools"
          export GNUSTEP_SYSTEM_APPS="$HERE/usr/System/Applications"
          
          export GNUSTEP_LOCAL_ROOT="$HERE/usr/Local"
          export GNUSTEP_LOCAL_LIBRARY="$HERE/usr/Local/Library"
          export GNUSTEP_LOCAL_TOOLS="$HERE/usr/Local/Tools"
          export GNUSTEP_LOCAL_APPS="$HERE/usr/Local/Applications"
          
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export PATH="$HERE/usr/local/bin:$HERE/usr/bin:$PATH"

          # 3. Kill off localized encoding mismatches
          #unset GCONV_PATH
          #export LC_ALL=C
          #export LANG=C

          # 4. Clean up the temp file when the application closes
          trap "rm -f $GNUSTEP_CONFIG_FILE" EXIT

          # We use the isolated 'PakManager' domain to avoid messing up the host's global defaults
          if [ -x "$HERE/usr/System/Tools/defaults" ]; then
            echo "Running defaults command..."
            "$HERE/usr/System/Tools/defaults" write PakManager GSTheme "Eau" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSFont "Sans" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSUserFont "Sans" || true
            "$HERE/usr/System/Tools/defaults" write PakManager NSUserFixedPitchFont "Monospace" || true
          else
            echo "ERROR: defaults tool not found at $HERE/usr/System/Tools/defaults"
          fi

          REAL_BIN=$(find "$HERE" -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1 || true)
          if [ -z "$REAL_BIN" ]; then
            REAL_BIN="$HERE/usr/Local/Applications/PakManager.app/PakManager"
          fi
          
          exec "$REAL_BIN" "$@"
          EOF
          chmod +x AppDir/AppRun

          # 3. Setup linuxdeploy and lobotomize the broken strip tool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          echo "Extracting linuxdeploy to patch internal tools..."
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null 2>&1
          
          # FIX: Replace the failing internal strip utility with a clean exit wrapper
          echo -e '#!/bin/sh\nexit 0' > squashfs-root/usr/bin/strip
          chmod +x squashfs-root/usr/bin/strip

          # 4. Gather Executables for linuxdeploy tracing
          ELF_ARGS=""
          REAL_APP_BIN=$(find AppDir -type f -name "PakManager" -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | head -n 1 || true)
          if [ -n "$REAL_APP_BIN" ]; then
            ELF_ARGS="--executable $REAL_APP_BIN"
          fi

          for tool in gdnc gpbs make_services; do
            if [ -f "AppDir/usr/lib/$tool" ]; then
              ELF_ARGS="$ELF_ARGS --executable AppDir/usr/lib/$tool"
            fi
          done

          # Feed the hidden GNUstep bundles directly to the parser
          find AppDir/usr -path "*/Bundles/*" -type f -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | while read -r bundle_bin; do
            ELF_ARGS="$ELF_ARGS --executable $bundle_bin"
          done

          # NEW: Trace any theme bundle binaries inside the local tree
          find AppDir/usr -path "*/Themes/*" -type f -exec file {} \; 2>/dev/null | grep "ELF" | cut -d: -f1 | while read -r theme_bin; do
            ELF_ARGS="$ELF_ARGS --executable $theme_bin"
          done

          # 5. Run the patched linuxdeploy process
          export PATH="${WORKSPACE_DIR}/squashfs-root/usr/bin:$PATH"
          export OUTPUT="PakManager-Linux-${{ env.APP_VERSION }}.AppImage"
          
          # Force the plugin to bypass FUSE mounting inside the LXC container
          export APPIMAGE_EXTRACT_AND_RUN=1
          
          # Stop the plugin from crashing on .desktop validation rules
          export NO_VALIDATE=1
          
          # Map paths so linuxdeploy finds libobjc and gnustep-base natively
          # FIX: Use --output appimage instead of --plugin appimage
          LD_LIBRARY_PATH="${LOCAL_PREFIX}/System/Library/Libraries:${LOCAL_PREFIX}/Local/Library/Libraries:${WORKSPACE_DIR}/AppDir/usr/lib:$LD_LIBRARY_PATH" \
          squashfs-root/AppRun --appdir AppDir $ELF_ARGS --output appimage
          
          # Cleanup
          rm -rf squashfs-root linuxdeploy*.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PakManager-Linux-${{ env.APP_VERSION }}
          path: ./*.AppImage
