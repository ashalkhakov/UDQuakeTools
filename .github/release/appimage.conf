# UDQuakeTools' AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
# Not "-Linux": an .AppImage says what it is for (AppImage asks names not to).
IMAGE=UDQuakeTools
NAME=UDQuakeTools
# The launcher, and the tools it starts.
APPS="UDLauncher DeclBrowser PakManager"
DEFAULT=UDLauncher
#   <image> declbrowser ...      (or a symlink so named)
ROUTES="declbrowser,decl=DeclBrowser pakmanager,pak=PakManager launcher,udlauncher=UDLauncher"
ENTRIES="Scripts/appimage/udquaketools.desktop=Sources/PakManager/PakManager.png"
# UDCodeKit's grammar bundles are loaded, not linked (Markdown's brings
# libstdc++); nor is the scripts' language server, which Decl Browser starts.
LOADED="DeclBrowser.app/PlugIns/*.bundle/* udscript-lsp"
REQUIRE="DeclBrowser.app/PlugIns/TreeSitterIdScript.bundle/TreeSitterIdScript DeclBrowser.app/PlugIns/TreeSitterIdDecl.bundle/TreeSitterIdDecl UDLauncher.app/Resources/MainMenu.xib DeclBrowser.app/Resources/DeclBrowser-Info.plist PakManager.app/Resources/UDArchiveDocument.xib"
# On a clean Ubuntu: the launcher, Decl Browser and Pak Manager each start, with their interface.
SMOKE_SCRIPT=Scripts/appimage-smoke.sh
